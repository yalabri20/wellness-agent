<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wellness Agent Demo</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --ink: #0f172a;
      --muted: #64748b;
      --green: #0e9f6e;
      --green-dark: #0b7a55;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #d1fae5 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e0f2fe 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      width: min(640px, 100%);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--green-dark);
      background: #d1fae5;
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      margin-bottom: 1rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      line-height: 1.15;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .links {
      display: grid;
      gap: 0.75rem;
    }
    a {
      display: block;
      text-decoration: none;
      color: white;
      background: var(--green);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      font-weight: 600;
      text-align: center;
      transition: background 0.15s ease;
    }
    a:hover { background: var(--green-dark); }
    a.secondary {
      color: var(--ink);
      background: #f1f5f9;
    }
    a.secondary:hover { background: #e2e8f0; }
    .note {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Misk Humain · Simulated data</div>
    <h1>Autonomous Corporate Wellness Agent</h1>
    <p>
      Work-hours energy coach for employees, plus a k-anonymous HR overview.
      Wellness guidance only — not medical advice.
    </p>
    <div class="links">
      <a href="/coach/">Open Wellness Coach</a>
      <a class="secondary" href="/hr/">Open HR Dashboard</a>
      <a class="secondary" href="/api/docs">API docs</a>
    </div>
    <p class="note">Demo stack: Streamlit + FastAPI + SQLite · seeded on each deploy.</p>
  </main>
</body>
</html>
