services:
  - type: web
    name: wellness-agent
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: API_BASE_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL
        value: sqlite:///./wellness.db
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: ACTIVITY_API_TOKEN
        value: wellness-demo-steps
      - key: ANTHROPIC_API_KEY
        sync: false
